<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>围棋一笔画 - 小川数字迷宫</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>围棋一笔画</h1>
        
        <div class="game-info">
            <div class="level-info">关卡: <span id="level-num">1</span></div>
            <div class="status-msg" id="status-msg">连接所有棋子完成一笔画！</div>
        </div>

        <div class="board-wrapper">
            <canvas id="game-canvas"></canvas>
        </div>

        <div class="controls">
            <button id="reset-btn">重置本关</button>
            <button id="next-level-btn" style="display: none;">下一关</button>
            <button id="back-btn">返回主页</button>
        </div>

        <div class="game-instructions">
            <h3>游戏规则</h3>
            <ul>
                <li><strong>黑色棋子</strong>为顶点，<strong>白色棋子</strong>为路径。</li>
                <li>必须从任意一个<strong>黑色棋子</strong>（顶点）开始滑动。</li>
                <li><strong>每个白色路径段只能经过一次</strong>。</li>
                <li>判断标准：根据欧拉路径理论，只有奇点（连接边数为奇数的顶点）个数为 0 或 2 的图形才能一笔画。</li>
                <li>走完所有白色棋子组成的路径即为过关！</li>
            </ul>
        </div>
    </div>

    <div id="victory-modal" class="modal">
        <div class="modal-content">
            <h2>太棒了！</h2>
            <p>你成功完成了一笔画挑战！</p>
            <button id="modal-next-btn">进入下一关</button>
            <button id="modal-home-btn">返回主页</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
