<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>围棋一笔画 - 小川数字迷宫</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>围棋一笔画</h1>
        
        <div class="game-info">
            <div class="level-selector">
                <label for="level-select">关卡:</label>
                <select id="level-select">
                    <!-- 动态生成关卡选项 -->
                </select>
            </div>
            <button id="random-btn" class="mini-btn">随机</button>
            <div class="status-msg" id="status-msg">连接所有线条完成一笔画！</div>
        </div>

        <div class="board-wrapper">
            <canvas id="game-canvas"></canvas>
        </div>

        <div class="controls">
            <button id="reset-btn">重置本关</button>
            <button id="next-level-btn" style="display: none;">下一关</button>
            <button id="back-btn">返回主页</button>
        </div>

        <div class="game-instructions">
            <h3>游戏规则</h3>
            <ul>
                <li>连接所有线条完成一笔画挑战。</li>
                <li><strong>起始点</strong>：点击任意圆点开始。</li>
                <li><strong>路径规则</strong>：每条连线<strong>必须且只能经过一次</strong>。</li>
                <li>圆点可以多次经过，但连线不可重复。</li>
                <li>完成所有线条的连接即为过关！</li>
            </ul>
        </div>
    </div>

    <div id="victory-modal" class="modal">
        <div class="modal-content">
            <h2>太棒了！</h2>
            <p>你成功完成了一笔画挑战！</p>
            <button id="modal-next-btn">进入下一关</button>
            <button id="modal-home-btn">返回主页</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
