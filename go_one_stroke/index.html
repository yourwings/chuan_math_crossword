<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>围棋一笔画 - 小川数字迷宫</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>围棋一笔画</h1>
        
        <div class="game-info">
            <div class="level-info">关卡: <span id="level-num">1</span></div>
            <div class="status-msg" id="status-msg">连接所有棋子完成一笔画！</div>
        </div>

        <div class="board-wrapper">
            <canvas id="game-canvas"></canvas>
        </div>

        <div class="controls">
            <button id="reset-btn">重置本关</button>
            <button id="next-level-btn" style="display: none;">下一关</button>
            <button id="back-btn">返回主页</button>
        </div>

        <div class="game-instructions">
            <h3>游戏规则</h3>
            <ul>
                <li>棋盘上由黑白棋子组成了特定的图案。</li>
                <li>从任意棋子出发，拖动鼠标或手指连接所有棋子。</li>
                <li><strong>每个棋子必须且只能经过一次</strong>。</li>
                <li>只能在有虚线连接的相邻棋子之间移动。</li>
                <li>经过所有棋子即为过关！</li>
            </ul>
        </div>
    </div>

    <div id="victory-modal" class="modal">
        <div class="modal-content">
            <h2>太棒了！</h2>
            <p>你成功完成了一笔画挑战！</p>
            <button id="modal-next-btn">进入下一关</button>
            <button id="modal-home-btn">返回主页</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
